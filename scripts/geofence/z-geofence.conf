# Country geofence for nw3weather via mod_maxminddb.
# Blocked ISO codes: AR BD BR CN CO HK ID IN IQ MA PH PK RU SG VE VN
# (Argentina, Bangladesh, Brazil, China, Colombia, Hong Kong, Indonesia,
# India, Iraq, Morocco, Philippines, Pakistan, Russia, Singapore, Venezuela, Vietnam)
# Database: DB-IP Country Lite at /var/www/geoip/dbip-country-lite.mmdb
# (the EPEL GeoLite2-Country.mmdb is from 2018; this drop-in overrides it).
#
# Loaded after conf.d/maxminddb.conf. That file enables the module only;
# it does not open GeoLite2-City.mmdb.

<IfModule mod_maxminddb.c>
    MaxMindDBEnable On
    MaxMindDBFile COUNTRY_DB /var/www/geoip/dbip-country-lite.mmdb
    MaxMindDBEnv MM_COUNTRY_CODE COUNTRY_DB/country/iso_code
</IfModule>

<Directory "/var/www/geoip">
    Require all denied
</Directory>

# Per-directory rewrite so VirtualHost RewriteEngine rules (HTTPS redirect)
# do not replace this. Covers docroot plus the webcam/volume aliases.
<IfModule mod_rewrite.c>
    <Directory "/var/www/html">
        RewriteEngine On
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteCond %{REQUEST_URI} !^/(400|401|403|404|500)\.html$
        RewriteCond %{ENV:MM_COUNTRY_CODE} ^(AR|BD|BR|CN|CO|HK|ID|IN|IQ|MA|PH|PK|RU|SG|VE|VN)$
        RewriteRule ^ - [F]
    </Directory>
    <Directory "/mnt/webcam/html">
        RewriteEngine On
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{ENV:MM_COUNTRY_CODE} ^(AR|BD|BR|CN|CO|HK|ID|IN|IQ|MA|PH|PK|RU|SG|VE|VN)$
        RewriteRule ^ - [F]
    </Directory>
    <Directory "/mnt/nw3-vol1/html">
        RewriteEngine On
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{ENV:MM_COUNTRY_CODE} ^(AR|BD|BR|CN|CO|HK|ID|IN|IQ|MA|PH|PK|RU|SG|VE|VN)$
        RewriteRule ^ - [F]
    </Directory>
</IfModule>
